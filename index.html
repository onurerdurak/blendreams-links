<style>
/* ─── reset & tokens ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050409;
  --text:#f4f2f8;
  --muted:rgba(244,242,248,.5);
  --faint:rgba(244,242,248,.32);
  --line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.035);
  --purple:#b060f0;
  --blue:#3a6fff;
  --orange:#e87d0d;
  --ease:cubic-bezier(.2,.8,.2,1);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --display:"Barlow Condensed",system-ui,sans-serif
}
html,body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif}
html,body{overflow-x:clip}
body{padding:34px 16px 22px;position:relative;min-height:100vh}
@media (max-width:760px){body{padding:22px 14px 16px}}

/* ─── background: near-black, one aurora ribbon, film grain ──────── */
.aurora{
  position:fixed;left:-20%;right:-20%;top:-18%;height:62%;
  pointer-events:none;z-index:0;
  background:linear-gradient(100deg,transparent 18%,rgba(176,96,240,.55) 36%,rgba(58,111,255,.5) 52%,rgba(232,125,13,.42) 68%,transparent 84%);
  filter:blur(70px) saturate(1.15);
  transform:rotate(-8deg);
  opacity:.55;
  animation:ribbon 26s ease-in-out infinite alternate
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%)}
.grain{
  position:fixed;inset:-50%;pointer-events:none;z-index:2;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite
}

/* ─── layout ────────────────────────────────────────────────────── */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

/* entrance: each block rises in, staggered */
.rise{opacity:0;transform:translateY(10px);animation:rise .4s var(--ease) forwards;animation-delay:calc(var(--d,0) * 15ms)}

/* ─── identity header ───────────────────────────────────────────── */
/* header: photo on the left, name block on the right */
.idhead{display:flex;align-items:center;gap:16px;max-width:100%}
.idtext{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.avatar{width:78px;height:78px;flex-shrink:0;border-radius:50%;position:relative}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 22%;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.45)}
.who{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.handle{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:6px}
.role{font-size:14px;font-weight:500;color:var(--muted);margin-top:6px;text-align:left;line-height:1.35}
.role .r1,.role .r2{white-space:nowrap}

/* ─── icon chips: white glass, bloom into brand color on hover ──── */
.icons{display:flex;justify-content:center;gap:26px;margin:28px 0 8px}
.ic{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit;transition:opacity .25s ease,filter .25s ease}
.ic .chip{
  width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;position:relative;overflow:hidden;isolation:isolate;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);
  color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .3s var(--ease),border-color .3s ease,box-shadow .3s ease,color .3s ease
}
.ic .chip::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s ease}
.ic .chip svg{width:31px;height:31px}
.ic .lbl{font-family:var(--mono);font-size:11.5px;color:var(--muted);transition:color .25s ease}
.yt .chip::before{background:radial-gradient(circle at 30% 30%,#ff7a3a,#e3223f 70%)}
.ig .chip::before{background:radial-gradient(circle at 30% 110%,#ffb347,#e1306c 45%,#8a3ab9 85%)}
.gr .chip::before{background:radial-gradient(circle at 30% 30%,#ff90e8,#c25bd9 75%)}
.st .chip::before{background:radial-gradient(circle at 30% 30%,#ff9a3c,#e8590c 75%)}
.web .chip::before{background:radial-gradient(circle at 30% 30%,#6a8bff,#7b4de0 75%)}

/* ─── section label ─────────────────────────────────────────────── */
.section-head{width:100%;display:flex;align-items:center;gap:14px;margin:28px 0 14px}
.section-head .label{font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.section-head .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.section-head .rule.l{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16))}

/* ─── featured: beveled square tiles, side by side ─────────────── */
.feats{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,96px));justify-content:center;gap:22px}
.feat{
  display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;
  text-decoration:none;color:inherit;transition:opacity .25s ease,filter .25s ease
}
.tile{
  width:100%;aspect-ratio:1;border-radius:19px;overflow:hidden;position:relative;isolation:isolate;
  background:#120d1f;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 24px rgba(0,0,0,.45);
  transition:transform .35s var(--ease),box-shadow .35s ease
}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
/* bevel: top highlight, soft gloss, darker bottom edge */
.tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -14px 22px rgba(0,0,0,.38)
}
/* hover: spinning gradient ring */
.tile::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:3;pointer-events:none;
  background:conic-gradient(from var(--ring-angle,0deg),rgba(176,96,240,0) 0deg,rgba(176,96,240,.95) 85deg,rgba(58,111,255,.95) 170deg,rgba(232,125,13,.95) 255deg,rgba(176,96,240,0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .3s ease
}
.tile.app{background:#000}
.tile.app img{transform:scale(1.1)}
.tile.hourglass{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(232,125,13,.6),transparent 65%),radial-gradient(circle at 80% 90%,rgba(58,111,255,.5),transparent 60%),#120d1f}
.tile.hourglass svg{width:28px;height:28px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.feat .title{font-family:var(--display);font-weight:800;font-size:13.5px;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:rgba(244,242,248,.92);white-space:nowrap}
.feat .kicker{font-family:var(--mono);font-size:9px;line-height:1;color:var(--faint);white-space:nowrap;margin-top:-3px}
.badge{
  position:absolute;bottom:6px;right:6px;z-index:4;
  font-family:var(--mono);font-weight:600;font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 5px;border-radius:999px;
  color:#0b0716;background:linear-gradient(90deg,#d9b8ff,#9fb6ff)
}

/* ─── trusted by: scrolling logo band (same look as the homepage strip) ── */
.trusted{width:100vw;margin:40px calc(50% - 50vw) 0}
.trusted-label{display:flex;align-items:center;gap:14px;max-width:520px;margin:0 auto 14px;padding:0 2px}
.trusted-label::before,.trusted-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16))}
.trusted-label::after{background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.trusted-label span{font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.band{
  position:relative;overflow:hidden;cursor:grab;user-select:none;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)
}
.band:active{cursor:grabbing}
.band-track{display:flex;align-items:center;width:max-content;will-change:transform}
.band-set{display:flex;align-items:center;gap:42px;padding:6px 21px}
.band img{height:16px;width:auto;object-fit:contain;flex-shrink:0;display:block;pointer-events:none;mix-blend-mode:screen;opacity:.55;filter:grayscale(1)}
.band img[alt="Corridor Digital"]{height:30px}
.band img[alt="Intel"]{height:27px}
.band img[alt="Razer"]{height:36px;filter:grayscale(1) brightness(2.2)}
.band img[alt="Snapchat"]{height:31px}
.band img[alt="Polycam"]{height:28px}
.band img[alt="Volkswagen"]{height:34px;filter:grayscale(1) invert(1)}
.band img[alt="KitBash3D"]{height:20px;filter:grayscale(1) brightness(10)}
.band img[alt="Rokoko"]{height:28px}
.band img[alt="Reallusion"]{height:27px}
.band img[alt="Polygoniq"]{height:31px}
.band img[alt="Nas Academy"]{height:29px}
.band img[alt="USCA"]{height:28px}
.band img[alt="Crunchyroll"]{height:29px}
.band img[alt="Marvel Rivals"]{height:28px;filter:grayscale(1) invert(1)}
.band img[alt="Megapol"]{height:30px}
.band img[alt="MKM Megapol Kültür Merkezi"]{height:28px}

/* hover effects only where there is a real mouse: on phones a tap would leave them stuck on */
@media (hover:hover){
  .ic:hover .chip{transform:translateY(-3px);border-color:transparent;color:#fff}
  .ic:hover .chip::before{opacity:1}
  .ic:hover .lbl{color:var(--text)}
  .yt:hover .chip{box-shadow:0 10px 26px rgba(227,34,63,.45)}
  .ig:hover .chip{box-shadow:0 10px 26px rgba(225,48,108,.45)}
  .gr:hover .chip{box-shadow:0 10px 26px rgba(194,91,217,.45)}
  .st:hover .chip{box-shadow:0 10px 26px rgba(232,89,12,.45)}
  .web:hover .chip{box-shadow:0 10px 26px rgba(106,139,255,.45)}
  .feat:hover .tile{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.55)}
  .feat:hover .tile::before{opacity:1;animation:ringspin 2.4s linear infinite}
  .feat:hover .tile img{transform:scale(1.06)}
  .feat:hover .tile.app img{transform:scale(1.16)}
  /* spotlight: dim the others while one is hovered */
  .wrap.is-hovering .ic:not(:hover),.wrap.is-hovering .feat:not(:hover){opacity:.5;filter:saturate(.8) brightness(.85)}
}

/* ─── animations ────────────────────────────────────────────────── */
@keyframes rise{to{opacity:1;transform:none}}
@keyframes ribbon{0%{transform:rotate(-8deg) translate3d(-4%,0,0)}100%{transform:rotate(-5deg) translate3d(4%,3%,0)}}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,2%)}100%{transform:translate(0,0)}}
@property --ring-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ringspin{to{--ring-angle:360deg}}

@media (prefers-reduced-motion:reduce){
  .aurora,.grain,.avatar{animation:none}
  .rise{animation:none;opacity:1;transform:none}
  .feat:hover .tile::before{animation:none}
}

/* ─── small screens (all phones; the desktop icon row needs ~502px) ── */
@media (max-width:520px){
  .who{font-size:28px}
  .avatar{width:80px;height:80px}
  .idhead{gap:14px}
  .role .sep{display:none}
  .role .r2{display:block}
  .role{font-size:13px}
  .icons{gap:11px}
  .ic .chip{width:54px;height:54px}
  .ic .chip svg{width:24px;height:24px}
  .ic .lbl{font-size:10px}
  .feats{grid-template-columns:repeat(3,minmax(0,84px));gap:20px}
  .tile{border-radius:17px}
  .feat .title{font-size:12.5px}
  .feat .kicker{font-size:8.5px}
}
/* Wix renders the mobile block 320px wide: keep the five links inside the side margins */
@media (max-width:340px){
  .icons{gap:8px}
  .ic .chip{width:50px;height:50px}
  .ic .chip svg{width:22px;height:22px}
  .ic .lbl{font-size:9.5px}
}
.mail{margin-top:30px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--faint);text-decoration:none;transition:color .25s ease}
.mail:hover{color:var(--text)}
</style>
</head>

<script>
(()=>{
  // trusted-by band: endless auto-scroll, draggable (mouse or touch), same feel as the homepage strip
  const band=document.getElementById('band'), track=document.getElementById('bandTrack');
  const set=track.querySelector('.band-set'), copy=set.cloneNode(true);
  copy.setAttribute('aria-hidden','true'); track.appendChild(copy);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // start with the first logo (Razer) a third of the way in, clear of the faded edge
  let off=-band.getBoundingClientRect().width*0.32,last=null,drag=false,sx=0,so=0;
  const speed=22;
  function tick(t){
    if(last===null) last=t;
    const dt=(t-last)/1000; last=t;
    if(!drag && !reduce) off+=speed*dt;
    const w=set.getBoundingClientRect().width;
    if(w>0) off=((off%w)+w)%w;
    track.style.transform=`translateX(${-off}px)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  band.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;so=off;band.setPointerCapture(e.pointerId);});
  band.addEventListener('pointermove',e=>{if(drag) off=so-(e.clientX-sx);});
  ['pointerup','pointercancel'].forEach(ev=>band.addEventListener(ev,()=>{drag=false;}));

  const wrap=document.getElementById('wrap');
  wrap.querySelectorAll('.ic,.feat').forEach(el=>{
    el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse') wrap.classList.add('is-hovering');});
    el.addEventListener('pointerleave',()=>wrap.classList.remove('is-hovering'));
  });
  // coming back from a link (back button / app switch) must not keep the spotlight on
  addEventListener('pageshow',()=>wrap.classList.remove('is-hovering'));
})();
</script>
